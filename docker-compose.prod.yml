# Production-style layout: postgres + fastapi + worker + bff + web + files (+ optional mcp).
# The browser talks only to `bff`; FastAPI and FileService are network-internal.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-website_profiling}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 5

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: website-profiling:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WP_ROLE: fastapi
      WEBSITE_PROFILING_ROOT: /app
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-website_profiling}
      DATA_DIR: /data
      PYTHON: /opt/venv/bin/python
      CHROME_PATH: /usr/bin/chromium
      LIGHTHOUSE_PATH: /usr/local/bin/lighthouse
      LIGHTHOUSE_CHROME_FLAGS: --headless --no-sandbox --disable-dev-shm-usage --disable-gpu
      DEPRECATE_PYTHON_INTEGRATIONS: "1"
    volumes:
      - profiling-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:8001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: website-profiling:latest
    depends_on:
      fastapi:
        condition: service_started
      postgres:
        condition: service_healthy
      files:
        condition: service_started
    environment:
      WP_ROLE: worker
      WEBSITE_PROFILING_ROOT: /app
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-website_profiling}
      DATA_DIR: /data
      PYTHON: /opt/venv/bin/python
      CHROME_PATH: /usr/bin/chromium
      LIGHTHOUSE_PATH: /usr/local/bin/lighthouse
      LIGHTHOUSE_CHROME_FLAGS: --headless --no-sandbox --disable-dev-shm-usage --disable-gpu
      FILE_SERVICE_URL: http://files:8080
      AI_SERVICE_URL: http://ai:8092
      INTEGRATIONS_SERVICE_URL: http://integrations:8093
    volumes:
      - profiling-data:/data

  data:
    build:
      context: ./services
      dockerfile: Data/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-website_profiling}
      ASPNETCORE_URLS: http://+:8091
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8091/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ai:
    build:
      context: ./services
      dockerfile: AiService/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-website_profiling}
      FASTAPI_URL: http://fastapi:8001
      ASPNETCORE_URLS: http://+:8092
      WP_MCP_HTTP: "1"
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8092/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  integrations:
    build:
      context: ./services
      dockerfile: IntegrationsService/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-website_profiling}
      ASPNETCORE_URLS: http://+:8093
      FASTAPI_URL: http://fastapi:8001
      USE_FASTAPI_PYTHON_BRIDGE: "1"
      ASPNETCORE_ENVIRONMENT: Production
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8093/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  files:
    build:
      context: ./services
      dockerfile: FileService/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-website_profiling}
      REPORT_API_URL: http://fastapi:8001
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started

  bff:
    build:
      context: ./services/Bff
    depends_on:
      fastapi:
        condition: service_started
      files:
        condition: service_started
      data:
        condition: service_healthy
      ai:
        condition: service_healthy
      integrations:
        condition: service_healthy
    ports:
      - '${BFF_PORT:-8090}:8090'
    environment:
      FASTAPI_URL: http://fastapi:8001
      FILE_SERVICE_URL: http://files:8080
      DATA_SERVICE_URL: http://data:8091
      AI_SERVICE_URL: http://ai:8092
      INTEGRATIONS_SERVICE_URL: http://integrations:8093
      DATA_ROUTES: "/api/report/meta,/api/report/payload,/api/report/history,/api/report/crawl-payload,/api/report/mobile-delta,/api/report/portfolio,/api/portfolio,/api/issues/status,/api/filters"
      AI_ROUTES: "/api/chat,/api/links/page-coach,/api/issues/fix-suggestion,/api/issues/action-plan,/api/ai/fix-suggestion,/api/dashboards/ai-generate,/api/content/analyze,/api/content/wizard,/api/llm-settings,/api/secrets,/api/ollama/status,/api/report/audit-tool,/api/mcp-tools"
      INTEGRATIONS_ROUTES: "/api/integrations/google,/api/integrations/bing"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:?set BFF_ALLOWED_ORIGINS (the public UI origin)}
      # Cross-site cookie (frontend + BFF on a shared parent domain over HTTPS):
      BFF_COOKIE_SAMESITE: ${BFF_COOKIE_SAMESITE:-None}
      BFF_COOKIE_SECURE: ${BFF_COOKIE_SECURE:-true}
      BFF_COOKIE_DOMAIN: ${BFF_COOKIE_DOMAIN:-}

  web:
    build:
      context: ./web
      args:
        VITE_BFF_BASE_URL: ${BFF_PUBLIC_URL:?set BFF_PUBLIC_URL (browser-facing BFF origin)}
    depends_on:
      bff:
        condition: service_started
    ports:
      - '${WEB_PORT:-3000}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/home']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp:
    build:
      context: ./services
      dockerfile: AiService/Dockerfile
    depends_on:
      ai:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-website_profiling}
      FASTAPI_URL: http://fastapi:8001
      ASPNETCORE_URLS: http://+:8092
      WP_MCP_HTTP: "1"
      WP_MCP_DOMAIN: ${WP_MCP_DOMAIN:-core}
      WP_PROPERTY_ID: ${WP_PROPERTY_ID:-}
    profiles:
      - mcp
    ports:
      - '${MCP_PORT:-8000}:8092'

volumes:
  pg-data:
  profiling-data:
