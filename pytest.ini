[pytest]
pythonpath = src
testpaths = tests
markers =
    browser: integration tests requiring Chromium/Playwright (deselect with '-m "not browser"')
    integration: requires DATABASE_URL (Postgres); skipped locally when unset
addopts =
    --cov=website_profiling
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=100
    -m "not browser"
