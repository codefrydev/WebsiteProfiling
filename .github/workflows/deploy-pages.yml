# Builds the React app (with generated report.db), pushes UI/dist to the gh-pages branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ml.txt

      - name: Download spaCy English model
        run: python -m spacy download en_core_web_sm

      - name: Generate report and SQLite DB
        run: python -m src

      - name: Ensure report.db in UI/public
        run: |
          if [ ! -f report.db ]; then
            echo "::error::report.db not found after python -m src"
            exit 1
          fi
          cp report.db UI/public/report.db

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: UI

      - name: Build static site
        run: npm run build
        working-directory: UI

      - name: Add .nojekyll for SPA
        run: touch UI/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: UI/dist
          publish_branch: gh-pages
          force_orphan: true
