name: CI

on:
  push:
    branches: [ master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: profiling
          POSTGRES_PASSWORD: profiling
          POSTGRES_DB: website_profiling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profiling -d website_profiling"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgres://profiling:profiling@localhost:5432/website_profiling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Pytest
        run: pytest tests/ -q
      - name: CLI smoke
        run: python -m src --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t website-profiling:ci .
      - name: Browser crawl tests in image
        run: |
          docker run --rm \
            -e DATABASE_URL=postgres://profiling:profiling@localhost:5432/website_profiling \
            website-profiling:ci \
            /opt/venv/bin/pytest tests/test_crawl_fetchers.py tests/test_crawler_browser_e2e.py -m browser -q -o addopts=

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
