name: Bug report
description: Something is broken or incorrect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first.
        Do **not** use this form for security vulnerabilities — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ./local-run
        2. Open Overview for example.com
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - Python / crawl / report
        - Database / migrations
        - Google integrations
        - Docker / deploy
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version (if known)
      placeholder: git SHA or tag
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant errors or attach screenshots
