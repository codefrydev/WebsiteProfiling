# Run pre-built backend + web images with the full split topology (CI / smoke).
# Usage:
#   docker build -t website-profiling:ci .
#   docker build -t website-profiling-web:ci ./web --build-arg VITE_BFF_BASE_URL=http://localhost:8090
#   BACKEND_IMAGE=website-profiling:ci WEB_IMAGE=website-profiling-web:ci \
#     docker compose -f docker-compose.pull.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: website_profiling
      POSTGRES_USER: profiling
      POSTGRES_PASSWORD: profiling
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profiling -d website_profiling"]
      interval: 5s
      timeout: 3s
      retries: 5

  fastapi:
    image: ${BACKEND_IMAGE:-website-profiling:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WP_ROLE: fastapi
      WEBSITE_PROFILING_ROOT: /app
      DATABASE_URL: postgres://profiling:profiling@postgres:5432/website_profiling
      DATA_DIR: /data
      PYTHON: /opt/venv/bin/python
      CHROME_PATH: /usr/bin/chromium
      LIGHTHOUSE_PATH: /usr/local/bin/lighthouse
      LIGHTHOUSE_CHROME_FLAGS: --headless --no-sandbox --disable-dev-shm-usage --disable-gpu
      FASTAPI_ALLOWED_ORIGINS: "http://localhost:8090"
      DEPRECATE_PYTHON_INTEGRATIONS: "1"
    volumes:
      - profiling-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${BACKEND_IMAGE:-website-profiling:latest}
    depends_on:
      fastapi:
        condition: service_started
      postgres:
        condition: service_healthy
      files:
        condition: service_started
    environment:
      WP_ROLE: worker
      WEBSITE_PROFILING_ROOT: /app
      DATABASE_URL: postgres://profiling:profiling@postgres:5432/website_profiling
      DATA_DIR: /data
      PYTHON: /opt/venv/bin/python
      CHROME_PATH: /usr/bin/chromium
      LIGHTHOUSE_PATH: /usr/local/bin/lighthouse
      LIGHTHOUSE_CHROME_FLAGS: --headless --no-sandbox --disable-dev-shm-usage --disable-gpu
      FILE_SERVICE_URL: http://files:8080
      AI_SERVICE_URL: http://ai:8092
      INTEGRATIONS_SERVICE_URL: http://integrations:8093
    volumes:
      - profiling-data:/data

  data:
    build:
      context: ./services
      dockerfile: Data/Dockerfile
    environment:
      DATABASE_URL: postgres://profiling:profiling@postgres:5432/website_profiling
      ASPNETCORE_URLS: http://+:8091
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ai:
    build:
      context: ./services
      dockerfile: AiService/Dockerfile
    environment:
      DATABASE_URL: postgres://profiling:profiling@postgres:5432/website_profiling
      FASTAPI_URL: http://fastapi:8001
      ASPNETCORE_URLS: http://+:8092
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8092/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  integrations:
    build:
      context: ./services
      dockerfile: IntegrationsService/Dockerfile
    environment:
      DATABASE_URL: postgres://profiling:profiling@postgres:5432/website_profiling
      ASPNETCORE_URLS: http://+:8093
      FASTAPI_URL: http://fastapi:8001
      USE_FASTAPI_PYTHON_BRIDGE: "1"
      AUTH_SECRET: ${AUTH_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8090/api/integrations/google/callback}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8093/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  files:
    build:
      context: ./services
      dockerfile: FileService/Dockerfile
    environment:
      DATABASE_URL: postgres://profiling:profiling@postgres:5432/website_profiling
      REPORT_API_URL: http://fastapi:8001
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started

  bff:
    build:
      context: ./services/Bff
    ports:
      - "8090:8090"
    environment:
      FASTAPI_URL: http://fastapi:8001
      FILE_SERVICE_URL: http://files:8080
      DATA_SERVICE_URL: http://data:8091
      AI_SERVICE_URL: http://ai:8092
      INTEGRATIONS_SERVICE_URL: http://integrations:8093
      BFF_ALLOWED_ORIGINS: "http://localhost:3000"
      DATA_ROUTES: "/api/report/meta,/api/report/payload,/api/report/history,/api/report/crawl-payload,/api/report/mobile-delta,/api/report/portfolio,/api/portfolio,/api/issues/status,/api/filters"
      AI_ROUTES: "/api/chat,/api/links/page-coach,/api/issues/fix-suggestion,/api/issues/action-plan,/api/ai/fix-suggestion,/api/dashboards/ai-generate,/api/content/analyze,/api/content/wizard,/api/llm-settings,/api/secrets,/api/ollama/status,/api/report/audit-tool,/api/mcp-tools"
      INTEGRATIONS_ROUTES: "/api/integrations/google,/api/integrations/bing"
    depends_on:
      fastapi:
        condition: service_started
      files:
        condition: service_started
      data:
        condition: service_healthy
      ai:
        condition: service_healthy
      integrations:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-website-profiling-web:latest}
    depends_on:
      bff:
        condition: service_started
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/home"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pg-data:
  profiling-data:
